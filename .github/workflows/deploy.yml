name: Deploy

on:
  push:
    branches: [main]
  # Weekly refresh of the engine and wiki data.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Update game data
        if: github.event_name != 'push'
        run: |
          git submodule update --remote vendor/osrs-dps-calc
          npm run fetch-recipes
          npm run fetch-restricted-items
          npm run fetch-recommended-equipment

      - name: Download price snapshots for the tests
        run: |
          mkdir -p scratch
          curl -fsS -A 'road-to-bis' https://prices.runescape.wiki/api/v1/osrs/mapping -o scratch/mapping.json
          curl -fsS -A 'road-to-bis' https://prices.runescape.wiki/api/v1/osrs/latest -o scratch/latest.json

      # Data that breaks the tests is never committed or deployed; the site keeps its last good build.
      - run: npm test

      # Before the build, so the footer names the commit with the new data.
      - name: Commit updated game data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/osrs-dps-calc src/data
          git diff --cached --quiet || (git commit -m 'Update game data' && git push)

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
